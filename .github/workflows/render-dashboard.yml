name: Render Dashboard

on:
  push:
    branches: [ main ]     # Se ejecuta automáticamente al hacer git push
  schedule:
    - cron: "0 8 * * *"   # Todos los días a las 8:00 UTC (3:00 am Lima)
  workflow_dispatch: {}     # Botón manual en la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Restaurar paquetes con renv
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: quarto render dashboard.qmd

      - name: Agrupar salida para Pages
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          [ -d dashboard_files ] && cp -r dashboard_files _site/ || true

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages