name: Render Dashboard

on:
  schedule:
    - cron: "0 8 * * *"   # todos los días 8:00 UTC (3:00 am Lima) — ajusta a tu necesidad
  workflow_dispatch: {}     # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Restaurar renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Escribir credenciales de la cuenta de servicio
        run: echo '${{ secrets.GCP_SA_KEY }}' > sa_key.json

      - name: Render dashboard
        env:
          GOOGLE_SA_KEY_PATH: sa_key.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: quarto render dashboard.qmd

      - name: Borrar credenciales
        if: always()
        run: rm -f sa_key.json

      - name: Agrupar salida para Pages
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          [ -d dashboard_files ] && cp -r dashboard_files _site/ || true

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages